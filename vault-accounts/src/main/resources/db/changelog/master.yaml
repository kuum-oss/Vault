databaseChangeLog:
  - changeSet:
      id: accounts-001-accounts
      author: vault
      changes:
        - createTable:
            tableName: accounts
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: owner_id, type: UUID, constraints: { nullable: false } }
              - column: { name: currency, type: VARCHAR(3), constraints: { nullable: false } }
              - column: { name: balance, type: DECIMAL(19,4), defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: reserved, type: DECIMAL(19,4), defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(16), defaultValue: ACTIVE, constraints: { nullable: false } }
              - column: { name: version, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addCheckConstraint: { tableName: accounts, constraintName: chk_balance, constraintBody: balance >= 0 }
        - addCheckConstraint: { tableName: accounts, constraintName: chk_reserved, constraintBody: reserved >= 0 }
        - createIndex: { tableName: accounts, indexName: idx_accounts_owner, columns: [ { column: { name: owner_id } } ] }
  - changeSet:
      id: accounts-002-audit
      author: vault
      changes:
        - createTable:
            tableName: account_audit
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: account_id, type: UUID, constraints: { nullable: false } }
              - column: { name: action, type: VARCHAR(32), constraints: { nullable: false } }
              - column: { name: actor_id, type: UUID }
              - column: { name: delta, type: DECIMAL(19,4) }
              - column: { name: balance_after, type: DECIMAL(19,4) }
              - column: { name: event_id, type: UUID }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
        - addUniqueConstraint: { tableName: account_audit, columnNames: event_id, constraintName: uq_account_audit_event }
        - createIndex: { tableName: account_audit, indexName: idx_audit_account, columns: [ { column: { name: account_id } } ] }
