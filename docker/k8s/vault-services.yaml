apiVersion: v1
kind: Namespace
metadata: { name: vault }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: vault-gateway, namespace: vault }
spec:
  replicas: 2
  selector: { matchLabels: { app: vault-gateway } }
  template:
    metadata: { labels: { app: vault-gateway } }
    spec:
      containers:
        - name: gateway
          image: vault-gateway:latest
          ports: [{ containerPort: 8080 }]
---
apiVersion: v1
kind: Service
metadata: { name: vault-gateway, namespace: vault }
spec:
  selector: { app: vault-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
  type: LoadBalancer
