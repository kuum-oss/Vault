# Apply a real secret from a CI/CD secret store; never commit its material.
apiVersion: v1
kind: Secret
metadata: { name: vault-security, namespace: vault }
type: Opaque
stringData:
  VAULT_RSA_PRIVATE_PEM: "-----BEGIN PRIVATE KEY-----..."
  VAULT_RSA_PUBLIC_PEM: "-----BEGIN PUBLIC KEY-----..."
  VAULT_DB_PASSWORD: "replace-me"
