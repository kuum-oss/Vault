services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: vault, POSTGRES_USER: vault, POSTGRES_PASSWORD: vault }
    ports: ["5432:5432"]
  kafka:
    image: apache/kafka:4.0.2
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  redis: { image: redis:7-alpine, ports: ["6379:6379"] }
  oracle-xe: { image: gvenzl/oracle-xe:21-slim, environment: { ORACLE_PASSWORD: vault }, ports: ["1521:1521"] }
  zipkin: { image: openzipkin/zipkin, ports: ["9411:9411"] }
  vault-kms:
    image: hashicorp/vault:1.17
    ports: ["8200:8200"]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: dev-root-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add: [IPC_LOCK]
    command: server -dev
  vault-init:
    image: hashicorp/vault:1.17
    depends_on: [vault-kms]
    environment:
      VAULT_ADDR: http://vault-kms:8200
      VAULT_TOKEN: dev-root-token
    volumes:
      - ./vault-init/init.sh:/vault-init/init.sh:ro
    entrypoint: ["/bin/sh", "/vault-init/init.sh"]
