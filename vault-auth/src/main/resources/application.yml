server:
  port: 8081
spring:
  application.name: vault-auth
  threads.virtual.enabled: true
  datasource:
    url: ${VAULT_JDBC_URL:jdbc:postgresql://localhost:5432/vault}
    username: ${VAULT_DB_USER:vault}
    password: ${VAULT_DB_PASSWORD:vault}
  liquibase:
    change-log: classpath:/db/changelog/master.yaml
management.endpoints.web.exposure.include: health,info,prometheus
vault.security:
  rsa-private-pem: ${VAULT_RSA_PRIVATE_PEM:}
  rsa-public-pem: ${VAULT_RSA_PUBLIC_PEM:}
