databaseChangeLog:
  - changeSet:
      id: auth-001-users
      author: vault
      changes:
        - createTable:
            tableName: auth_users
            columns:
              - column: { name: id, type: UUID, constraints: { primaryKey: true, nullable: false } }
              - column: { name: email, type: VARCHAR(320), constraints: { nullable: false, unique: true } }
              - column: { name: password_hash, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: totp_ciphertext, type: TEXT, constraints: { nullable: false } }
              - column: { name: totp_nonce, type: TEXT, constraints: { nullable: false } }
              - column: { name: totp_encrypted_dek, type: TEXT, constraints: { nullable: false } }
              - column: { name: totp_key_version, type: INTEGER, defaultValueNumeric: 1, constraints: { nullable: false } }
              - column: { name: account_frozen, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, defaultValueComputed: CURRENT_TIMESTAMP, constraints: { nullable: false } }
